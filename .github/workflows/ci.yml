name: CI

# Phase 0 baseline. Runs on every push and PR.
# Grows as backend services land in apps/api (Phase 1+).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------
  # Frontend — apps/web
  # Already fully implemented; this gate must stay green.
  # ---------------------------------------------------------------
  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build (tsc && vite build)
        run: npm --workspace=apps/web run build

      - name: Upload web build artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist/
          retention-days: 7

  # ---------------------------------------------------------------
  # Backend — apps/api
  # Phase 1: typecheck + prisma generate + unit tests + integration tests
  # against a real Postgres service container.
  # ---------------------------------------------------------------
  api:
    name: API — typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests still spin up their own Testcontainers Postgres per
      # test file; the service above is for prisma validate / seed smoke only.
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      S3_DOCUMENTS_BUCKET: platform-documents
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      AUDIT_HASH_SECRET: ci-audit-hash-secret-32-chars-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate
        run: npm --workspace=apps/api run db:generate

      - name: Prisma migrate deploy (sanity)
        run: npm --workspace=apps/api run db:migrate

      - name: Typecheck
        run: npm --workspace=apps/api run typecheck

      - name: Unit tests (vitest)
        run: npm --workspace=apps/api test

      - name: Integration tests (testcontainers postgres)
        run: npm --workspace=apps/api run test:integration

  # ---------------------------------------------------------------
  # Frontend regression — Playwright smoke suite
  # One happy-path per module running against the built static bundle
  # (vite preview). MSW is active so the browser never hits a real API
  # during the smoke — the point is to catch router/boot regressions.
  # Depth per module arrives with each Phase 3 cutover.
  # ---------------------------------------------------------------
  web-smoke:
    name: Web — Playwright smoke
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browser
        run: npm --workspace=apps/web run test:e2e:install

      - name: Build web
        run: npm --workspace=apps/web run build

      - name: Run Playwright smoke
        run: npm --workspace=apps/web run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # ---------------------------------------------------------------
  # Load smoke — k6 against a self-hosted api service container.
  # Validates the SLO thresholds encoded in tests/load/smoke.js on every
  # push. Baseline + peak scenarios run on cron (see .github/workflows/
  # load-nightly.yml) rather than per-PR to stay inside Actions minutes.
  # ---------------------------------------------------------------
  load-smoke:
    name: Load — k6 smoke
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      S3_DOCUMENTS_BUCKET: platform-documents
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      AUDIT_HASH_SECRET: ci-audit-hash-secret-32-chars-long
      SECRETS_PROVIDER: env
      PORT: '3101'
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3101
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate + migrate deploy
        run: |
          npm --workspace=apps/api run db:generate
          npm --workspace=apps/api run db:migrate

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start API in background
        working-directory: apps/api
        run: |
          npx tsx src/server.ts &
          echo $! > /tmp/api.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3101/health >/dev/null 2>&1; then
              echo "API up"; break
            fi
            sleep 1
          done

      - name: Run k6 smoke
        run: k6 run --out json=k6-smoke.json apps/api/tests/load/smoke.js
        env:
          E2E_BASE_URL: http://localhost:3101

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) 2>/dev/null || true
          fi

      - name: Upload k6 artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-${{ github.sha }}
          path: |
            k6-smoke.json
          retention-days: 7

  # ---------------------------------------------------------------
  # Shared types package
  # ---------------------------------------------------------------
  types:
    name: Types — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck shared types
        run: |
          if [ -f packages/types/tsconfig.json ]; then
            npm --workspace=packages/types run typecheck --if-present || npx -w packages/types tsc --noEmit
          else
            echo "packages/types tsconfig not present — skipping"
          fi

  # ---------------------------------------------------------------
  # Web ↔ API integration smoke — Phase 2 cutover gate.
  # Spins up the API against the postgres+redis service containers from
  # the `api` job, seeds the DB, then runs a thin Playwright suite with
  # MSW DISABLED (VITE_MOCK_*=off) so every request walks the real API.
  # Catches cutover-time regressions (CORS, cookie Domain, 401 handling,
  # error-shape drift) before they land in demo.
  # ---------------------------------------------------------------
  web-integration:
    name: Web ↔ API — live integration smoke
    runs-on: ubuntu-latest
    needs: [web, api]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      AUDIT_HASH_SECRET: ci-audit-hash-secret-32-chars-long
      S3_DOCUMENTS_BUCKET: ci-documents
      BLOB_PROVIDER: local
      BLOB_LOCAL_ROOT_DIR: /tmp/blob-ci
      BLOB_LOCAL_SIGNING_KEY: ci-local-blob-signing-key-at-least-32
      CORS_ORIGIN: http://localhost:4173
      SECRETS_PROVIDER: env
      PORT: '3001'
      HOST: '127.0.0.1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx --workspace=apps/web playwright install --with-deps chromium

      - name: Prisma generate + migrate + seed
        run: |
          npm --workspace=apps/api run db:generate
          npm --workspace=apps/api run db:migrate
          npm --workspace=apps/api run db:seed

      - name: Build API + worker
        run: |
          npm --workspace=apps/api run build

      - name: Build web bundle with MSW off
        env:
          VITE_API_URL: http://127.0.0.1:3001
          VITE_BYPASS_AUTH: 'true'   # CI env has no IdP; keep bypass on for now
          VITE_MOCK_AUTH: off
          VITE_MOCK_PROJECTS: off
          VITE_MOCK_MODULE_A: off
          VITE_MOCK_MODULE_B: off
          VITE_MOCK_MODULE_C: off
          VITE_MOCK_MODULE_D: off
          VITE_MOCK_MODULE_E: off
        run: npm --workspace=apps/web run build

      - name: Start API in background
        run: |
          cd apps/api
          nohup node dist/server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          # Wait for /ready to return 200 (Postgres + Redis checks pass).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/ready || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            echo "API not ready yet (code=$code), retry $i/30"
            sleep 2
          done
          echo "API failed to become ready — tail of log:"
          tail -100 /tmp/api.log
          exit 1

      - name: Run smoke suite against live API
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npx --workspace=apps/web playwright test playwright/smoke

      - name: Dump API log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: Shutdown API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then kill -TERM "$(cat /tmp/api.pid)" || true; fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report-${{ github.sha }}
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------
  # Web a11y — WCAG 2.1 AA regression via @axe-core/playwright.
  # Runs the built static bundle under vite preview + axe-core probes.
  # Failing a11y violations here means the module's UI leaked a WCAG
  # issue; fix in the component before merging.
  # ---------------------------------------------------------------
  a11y:
    name: Web — WCAG 2.1 AA (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers (chromium only)
        run: npx --workspace=apps/web playwright install --with-deps chromium

      - name: Build web bundle
        run: npm --workspace=apps/web run build

      - name: Run axe-core WCAG suite
        run: npx --workspace=apps/web playwright test playwright/a11y
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report-${{ github.sha }}
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------
  # Docs sanity — ensure ADRs, plan, and SME READMEs parse cleanly
  # (lightweight: just a markdown lint, no link-checking yet)
  # ---------------------------------------------------------------
  docs:
    name: Docs — markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            !docs/demo/**
            !docs/wireframe/**
            !docs/OneDrive_*/**
          config: '.markdownlint.jsonc'
        continue-on-error: true  # Phase 0: advisory only; tighten in Phase 1
