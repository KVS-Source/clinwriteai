name: Deploy to demo

# Auto-deploys to the demo VPS on every push to main that passes CI.
# Phase 1 — only this one env for now; staging/prod wire in Phase 5+.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEMO_HOST            e.g. api.clinwrite.ai  (or raw IP)
#   DEMO_SSH_USER        e.g. platform
#   DEMO_SSH_PRIVATE_KEY an ed25519 key authorised in /home/platform/.ssh/authorized_keys on the VPS
#   DEMO_SSH_KNOWN_HOSTS output of `ssh-keyscan -t ed25519 api.clinwrite.ai`

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI dependency (manual force-deploy)'
        type: boolean
        default: false

concurrency:
  group: deploy-demo
  cancel-in-progress: false   # don't kill an in-progress deploy

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Wait for Web build
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Web — typecheck + build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: Wait for API tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'API — typecheck + tests'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: Wait for Playwright smoke
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Web — Playwright smoke'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  deploy:
    name: Deploy to demo VPS
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    if: ${{ always() && (needs.wait-for-ci.result == 'success' || inputs.skip_tests) }}
    environment:
      name: demo
      url: https://demo.clinwrite.ai
    timeout-minutes: 15
    steps:
      - name: Checkout (for context in logs — the actual pull happens on the VPS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEMO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEMO_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run deploy script on demo VPS
        env:
          HOST: ${{ secrets.DEMO_HOST }}
          USER: ${{ secrets.DEMO_SSH_USER }}
          COMMIT: ${{ github.sha }}
        run: |
          # Two-phase: (1) bootstrap — idempotent one-off system setup
          # that runs even on first-ever deploy against a fresh/shared
          # VPS where /opt/platform doesn't exist yet; (2) deploy.sh —
          # the normal update loop. Bootstrap short-circuits in ~1s on
          # already-provisioned hosts.
          #
          # Uses `sudo -n` so the deploy fails with a readable error
          # if passwordless sudo isn't configured for the deploy user
          # (instead of hanging on the password prompt until SSH times
          # out with the maddeningly opaque exit code 255).
          #
          # `ssh -tt` forces a pseudo-TTY so sudo's error messages
          # make it back to the Actions log instead of being dropped.
          # `set -x` makes each command print before execution so we
          # can see exactly where a first-time deploy died.
          ssh -o StrictHostKeyChecking=yes -tt "${USER}@${HOST}" bash <<EOF
            set -euxo pipefail
            echo "=== deploy for commit ${COMMIT} ==="
            whoami
            sudo -n true || { echo "FATAL: passwordless sudo not configured for \$(whoami)"; exit 2; }

            # Phase 1 — bootstrap (idempotent; short-circuits on second run)
            BOOTSTRAP_URL="https://raw.githubusercontent.com/KVS-Source/clinwriteai/${COMMIT}/infra/standalone/scripts/first-run-bootstrap.sh"
            TMP=\$(mktemp)
            curl -fsSL "\${BOOTSTRAP_URL}" -o "\${TMP}"
            sudo -n bash "\${TMP}" 2>&1 | tail -200
            rm -f "\${TMP}"

            # Phase 2 — standard deploy (git pull + build + migrate + seed + restart)
            sudo -n /opt/platform/repo/infra/standalone/scripts/deploy.sh 2>&1 | tail -300
          EOF

      - name: Verify health
        env:
          HEALTH_URL: https://api.clinwrite.ai/health
        run: |
          for i in {1..10}; do
            if curl -fsS "${HEALTH_URL}" | tee /dev/stderr | grep -q '"status":"ok"'; then
              echo "✓ demo environment healthy at ${HEALTH_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "✗ demo environment health check failed after 10 attempts"
          exit 1

      - name: Smoke test — frontend reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://demo.clinwrite.ai/)
          if [[ "$code" != "200" ]]; then
            echo "✗ Frontend returned $code"
            exit 1
          fi
          echo "✓ Frontend returned 200"

      - name: Notify on failure
        if: failure()
        run: |
          # Hook up Slack / Discord / email later; for now just log
          echo "DEPLOY TO DEMO FAILED — manual intervention needed. SSH to the VPS and run scripts/deploy.sh with the last-known-good commit to roll back."
