# Secret scan — second line of defence after the local pre-commit hook.
# Required check on main; blocks merge if any secret pattern matches a
# diff between the PR head and the merge base.
#
# Why --no-git here: gitleaks' default scan mode walks `.git` history,
# which is slow in a 1000+ commit repo. --no-git falls back to a flat
# filesystem scan of the checked-out tree, which is what we actually
# want for PR-level enforcement.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full-history scan — catches secrets committed before the
    # pre-commit hook or the PR gate were in place.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is expensive but needed for the weekly scan;
          # PR scans can get away with 1 but we unify for simplicity.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job on findings — this is the whole point of the gate.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
