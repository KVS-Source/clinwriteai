# =====================================================================
# ClinWrite.AI · Prototype vhost
# Canonical: https://proto.clinwrite.ai
# Mirror:    https://proto.clinwriteai.com  →  301 to canonical
#
# Deploy target: /etc/nginx/sites-available/clinwrite-proto
# =====================================================================

# ---------------------------------------------------------------------
# Port 80 · HTTP → HTTPS for both hostnames (and ACME challenge passthrough)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name proto.clinwrite.ai proto.clinwriteai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/proto.clinwrite.ai;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# Port 443 · HTTPS mirror — proto.clinwriteai.com → proto.clinwrite.ai
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proto.clinwriteai.com;

    ssl_certificate     /etc/letsencrypt/live/proto.clinwrite.ai-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proto.clinwrite.ai-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 301 permanent — preserves path and query string
    return 301 https://proto.clinwrite.ai$request_uri;
}

# ---------------------------------------------------------------------
# Port 443 · HTTPS canonical — proto.clinwrite.ai serves the SPA
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proto.clinwrite.ai;

    root  /var/www/proto.clinwrite.ai;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/proto.clinwrite.ai-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proto.clinwrite.ai-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/proto.clinwrite.ai;
    }

    # SPA fallback — React Router owns client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker — MSW updates every deploy
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Never cache index.html — new deploys must load fresh asset hashes
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Cache hashed assets aggressively (they're content-addressed)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
