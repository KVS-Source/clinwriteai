# nginx config for the standalone VPS. Terminates TLS from Cloudflare
# (origin cert installed by scripts/bootstrap.sh), reverse-proxies to API +
# serves the static web bundle.
#
# Install path on VPS: /etc/nginx/sites-available/platform
# Enable:              ln -s ../sites-available/platform /etc/nginx/sites-enabled/
# Test + reload:       nginx -t && systemctl reload nginx

# ---------------------------------------------------------------------
# Upstreams — Node services listening on loopback
# ---------------------------------------------------------------------
upstream platform_api {
  server 127.0.0.1:3001 fail_timeout=10s max_fails=3;
  keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP → HTTPS redirect (both app + api hosts)
# ---------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name app.staging.clinwrite.ai api.staging.clinwrite.ai;

  # ACME challenge path for Let's Encrypt (backup to Cloudflare origin cert)
  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------------
# API — api.<env>.clinwrite.ai
# ---------------------------------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.staging.clinwrite.ai;

  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  include             /etc/nginx/snippets/platform-security-headers.conf;
  include             /etc/nginx/snippets/platform-cloudflare-allowlist.conf;

  # Large uploads for CSR binaries + voice notes (adjust per actual limits)
  client_max_body_size 100M;

  # Health check — bypasses WAF for Cloudflare monitors
  location = /health {
    proxy_pass http://platform_api;
    access_log off;
  }

  # Public tokenised KOL review route — stricter rate limits enforced at Cloudflare
  location /kol-review/ {
    limit_req zone=kol_review burst=20 nodelay;
    proxy_pass http://platform_api;
    include /etc/nginx/snippets/platform-proxy-headers.conf;
  }

  # Everything else proxies to the Fastify API
  location / {
    proxy_pass http://platform_api;
    include /etc/nginx/snippets/platform-proxy-headers.conf;
    proxy_read_timeout 300s;   # AI calls can be slow
  }

  access_log /var/log/nginx/platform-api.access.log;
  error_log  /var/log/nginx/platform-api.error.log;
}

# ---------------------------------------------------------------------
# Web app — app.<env>.clinwrite.ai (static SPA bundle)
# ---------------------------------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.staging.clinwrite.ai;

  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  include             /etc/nginx/snippets/platform-security-headers.conf;

  root  /var/www/platform/dist;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache index.html — new deploys must load fresh asset hashes
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Cache hashed assets aggressively (content-addressed)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  access_log /var/log/nginx/platform-web.access.log;
  error_log  /var/log/nginx/platform-web.error.log;
}

# ---------------------------------------------------------------------
# Rate limit zones (defined in /etc/nginx/nginx.conf http block or here)
# ---------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=kol_review:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
