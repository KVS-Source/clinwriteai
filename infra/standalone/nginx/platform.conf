# nginx config for the standalone VPS. Terminates TLS (Let's Encrypt
# cert provisioned by scripts/setup-letsencrypt.sh — one multi-domain
# cert covering demo.clinwrite.ai + api.clinwrite.ai), reverse-proxies
# to API + serves the static web bundle.
#
# Install path on VPS: /etc/nginx/sites-available/platform
# Enable:              ln -s ../sites-available/platform /etc/nginx/sites-enabled/
# Test + reload:       nginx -t && systemctl reload nginx
#
# Cert paths resolve to /etc/letsencrypt/live/demo.clinwrite.ai/*
# because demo.clinwrite.ai is the "primary" domain on the SAN cert
# (first -d flag in setup-letsencrypt.sh). Both server blocks use the
# same cert — a single multi-domain Let's Encrypt cert is cheaper
# ops-wise than two separate certs renewing on different schedules.

# ---------------------------------------------------------------------
# WebSocket upgrade map — Socket.io presence (Phase 3A) sends an
# `Upgrade: websocket` header; nginx needs the matching `Connection:
# upgrade` on the proxy. This `map` creates the $connection_upgrade
# variable the snippets/proxy-headers.conf references.
# ---------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------------------------------------------------------------------
# Rate-limit zones — `limit_req zone=X` later in the file references
# these; nginx will emit "zero size shared memory zone" if the zone
# isn't declared with limit_req_zone at the http level.
# ---------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=kol_review:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth:10m       rate=20r/m;

# ---------------------------------------------------------------------
# Upstreams — Node services listening on loopback.
#
# Blue/green model (deploy-bluegreen.sh):
#   - Two colour-tagged backends on different ports.
#   - The INACTIVE colour carries `weight=0` so nginx stops routing to it.
#   - The deploy script sed-flips the weight attribute + the ACTIVE_COLOUR
#     marker atomically before `systemctl reload nginx`.
#   - `max_fails=3 fail_timeout=10s` means a crashed inactive colour won't
#     cause nginx to try it; nginx removes it from the pool on first miss
#     and comes back after fail_timeout, by which time the deploy script
#     has either succeeded or reverted.
# ---------------------------------------------------------------------
# ACTIVE_COLOUR=blue
# NB: nginx open-source doesn't accept `weight=0` (only nginx-plus).
# Use `down` to disable the inactive colour. deploy-bluegreen.sh is
# aware of this and sed-swaps `down` between the two lines on cutover.
upstream platform_api {
  server 127.0.0.1:3001 fail_timeout=10s max_fails=3;              # blue
  server 127.0.0.1:3002 down fail_timeout=10s max_fails=3;         # green
  keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP → HTTPS redirect (both app + api hosts)
# ---------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name demo.clinwrite.ai api.clinwrite.ai;

  # ACME challenge path for Let's Encrypt (backup to Cloudflare origin cert)
  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------------
# API — api.<env>.clinwrite.ai
# ---------------------------------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.clinwrite.ai;

  ssl_certificate     /etc/letsencrypt/live/demo.clinwrite.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo.clinwrite.ai/privkey.pem;
  include             /etc/nginx/snippets/platform-security-headers.conf;
  include             /etc/nginx/snippets/platform-cloudflare-allowlist.conf;

  # Large uploads for CSR binaries + voice notes (adjust per actual limits)
  client_max_body_size 100M;

  # Health check — bypasses WAF for Cloudflare monitors
  location = /health {
    proxy_pass http://platform_api;
    access_log off;
  }

  # Public tokenised KOL review route — stricter rate limits enforced at Cloudflare
  location /kol-review/ {
    limit_req zone=kol_review burst=20 nodelay;
    proxy_pass http://platform_api;
    include /etc/nginx/snippets/platform-proxy-headers.conf;
  }

  # Everything else proxies to the Fastify API
  location / {
    proxy_pass http://platform_api;
    include /etc/nginx/snippets/platform-proxy-headers.conf;
    proxy_read_timeout 300s;   # AI calls can be slow
  }

  access_log /var/log/nginx/platform-api.access.log;
  error_log  /var/log/nginx/platform-api.error.log;
}

# ---------------------------------------------------------------------
# Web app — app.<env>.clinwrite.ai (static SPA bundle)
# ---------------------------------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name demo.clinwrite.ai;

  ssl_certificate     /etc/letsencrypt/live/demo.clinwrite.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo.clinwrite.ai/privkey.pem;
  include             /etc/nginx/snippets/platform-security-headers.conf;

  root  /var/www/platform/dist;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache index.html — new deploys must load fresh asset hashes
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Cache hashed assets aggressively (content-addressed)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  access_log /var/log/nginx/platform-web.access.log;
  error_log  /var/log/nginx/platform-web.error.log;
}

# ---------------------------------------------------------------------
# Rate limit zones (defined in /etc/nginx/nginx.conf http block or here)
# ---------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=kol_review:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
