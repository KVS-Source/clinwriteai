# Only accept connections from Cloudflare IPs (prevents direct origin access).
# Update periodically from https://www.cloudflare.com/ips/
# Last updated: 2026-10-05 — refresh quarterly or when Cloudflare announces changes.
#
# Install path on VPS: /etc/nginx/snippets/platform-cloudflare-allowlist.conf

# Cloudflare IPv4 (as of 2026-10-05)
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;

# Cloudflare IPv6
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

# Deny everything else — direct origin access blocked
deny all;

# Restore real client IP from Cloudflare's CF-Connecting-IP header
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
