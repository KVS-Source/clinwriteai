# HTTP security headers — included from every server block.
# Install path on VPS: /etc/nginx/snippets/platform-security-headers.conf

# HSTS: only enable after we're sure every subdomain is HTTPS-only
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Clickjacking defence
add_header X-Frame-Options "DENY" always;

# MIME-sniffing defence
add_header X-Content-Type-Options "nosniff" always;

# Referrer leak defence
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy: disable features we don't use
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;

# CSP: starts strict; relax per actual third-party embeds (fonts, images, Grafana embeds etc.)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://qa-api.clinwrite.ai; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
