# HTTP security headers — included from every server block.
# Install path on VPS: /etc/nginx/snippets/platform-security-headers.conf

# HSTS: only enable after we're sure every subdomain is HTTPS-only
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Clickjacking defence
add_header X-Frame-Options "DENY" always;

# MIME-sniffing defence
add_header X-Content-Type-Options "nosniff" always;

# Referrer leak defence
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy: disable features we don't use
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;

# CSP: strict baseline + the specific third-parties we actually embed:
#   - fonts.googleapis.com (stylesheet) + fonts.gstatic.com (woff2) — used by
#     apps/web/src/index.css for Plus Jakarta Sans + IBM Plex Mono. connect-src
#     also lists both because MSW's service-worker passthrough re-issues font
#     fetches through fetch() which hits connect-src rather than font-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.clinwrite.ai https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
