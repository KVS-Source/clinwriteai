# Prometheus scrape config for the standalone VPS.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: staging        # override per env via Compose env
    service: platform

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
    relabel_configs:
      - target_label: component
        replacement: api

  - job_name: platform-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3002"]
    relabel_configs:
      - target_label: component
        replacement: worker

  # Node exporter — install via package on the VPS, scraped on host port 9100
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Postgres exporter — add as a sibling Compose service in Phase 1
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis exporter — add as a sibling Compose service in Phase 1
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
